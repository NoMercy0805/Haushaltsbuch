name: Cleanup CarService migration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove migrated CarService release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete carservice-latest --cleanup-tag --yes || true
