name: Apply title suggestion delete behavior
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-title-suggestion-delete.yml' ]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_title_suggestion_delete.py
      - run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add haushaltsbuch-offline-app/app/src/main/assets/index.html
          git diff --cached --check
          git commit -m "Delete title suggestions instead of hiding them"
          rm tools/apply_title_suggestion_delete.py .github/workflows/apply-title-suggestion-delete.yml
          git add -A
          git commit --amend --no-edit
          git push
# retry with anchor-based patch
