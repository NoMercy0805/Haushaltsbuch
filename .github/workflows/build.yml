name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haushaltsbuch-offline-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Set incrementing version code
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle

      - name: Verify keystore fingerprint
        run: |
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          echo "Gefundener Fingerabdruck: $FINGERPRINT"
          EXPECTED="90:D7:94:A6:9C:A8:58:88:15:18:3E:FA:11:12:02:D6:54:A9:21:8C"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "FEHLER: Der Schluessel stimmt nicht mit dem erwarteten ueberein!"
            exit 1
          fi
          echo "Schluessel korrekt verifiziert."

      - name: Inject Kontostand entry actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="beta-entry-actions.js"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('FEHLER: </body> in index.html nicht gefunden')
              html = html.replace('</body>', tag + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify actual APK signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Pruefe Signatur von: $APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep "SHA1:" || echo "WARNUNG: Konnte Signatur nicht auslesen (unsignierte APK?)"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Haushaltsbuch.apk

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Haushaltsbuch
          path: haushaltsbuch-offline-app/app/build/outputs/apk/release/Haushaltsbuch.apk

# Manual rebuild trigger 2026-10-10

      - name: Publish signed APK for MyAppHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/Haushaltsbuch.apk"
          test -s "$APK"
          TAG="haushaltsbuch-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK#Haushaltsbuch.apk" --target "$GITHUB_SHA" \
            --title "Haushaltsbuch Build ${{ github.run_number }}" \
            --notes "Android-versionCode: ${{ github.run_number }}"
