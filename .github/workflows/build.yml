name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haushaltsbuch-offline-app
    steps:
      - uses: actions/checkout@v4

      - name: Apply FAB startup visibility fix and restore workflow
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('haushaltsbuch-offline-app/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old="  (function(){\n    var fab = document.querySelector('.fab-add');\n    if(!fab) return;\n    var lastScrollY = window.scrollY;\n    var ticking = false;\n    window.addEventListener('scroll', function(){\n      if(ticking) return;\n      ticking = true;\n      requestAnimationFrame(function(){\n        var currentY = window.scrollY;\n        if(currentY > lastScrollY && currentY > 40){\n          fab.classList.add('fab-hidden');\n        } else {\n          fab.classList.remove('fab-hidden');\n        }\n        lastScrollY = currentY;\n        ticking = false;\n      });\n    }, {passive:true});\n  })();\n"
          new="  (function(){\n    var fab = document.querySelector('.fab-add');\n    if(!fab) return;\n    // Bei jedem App-Start beginnt der Plus-Kreis sichtbar, auch wenn WebView eine alte Scrollposition wiederherstellt.\n    fab.classList.remove('fab-hidden');\n    var lastScrollY = window.scrollY;\n    var hasUserScrolled = false;\n    var ticking = false;\n    window.addEventListener('scroll', function(){\n      if(ticking) return;\n      ticking = true;\n      requestAnimationFrame(function(){\n        var currentY = window.scrollY;\n        var delta = currentY - lastScrollY;\n        if(Math.abs(delta) > 2) hasUserScrolled = true;\n        if(hasUserScrolled && currentY > lastScrollY && currentY > 40){\n          fab.classList.add('fab-hidden');\n        } else if(hasUserScrolled && currentY < lastScrollY){\n          fab.classList.remove('fab-hidden');\n        }\n        lastScrollY = currentY;\n        ticking = false;\n      });\n    }, {passive:true});\n  })();\n"
          if old not in s: raise SystemExit('FAB scroll block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git show HEAD~2:.github/workflows/build.yml > .github/workflows/build.yml
          git add haushaltsbuch-offline-app/app/src/main/assets/index.html .github/workflows/build.yml
          git diff --cached --check
          git commit -m "Keep add button visible on app start [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Set incrementing version code
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle

      - name: Verify keystore fingerprint
        run: |
          FINGERPRINT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          echo "Gefundener Fingerabdruck: $FINGERPRINT"
          EXPECTED="90:D7:94:A6:9C:A8:58:88:15:18:3E:FA:11:12:02:D6:54:A9:21:8C"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "FEHLER: Der Schluessel stimmt nicht mit dem erwarteten ueberein!"
            exit 1
          fi
          echo "Schluessel korrekt verifiziert."

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify actual APK signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Pruefe Signatur von: $APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep "SHA1:" || echo "WARNUNG: Konnte Signatur nicht auslesen (unsignierte APK?)"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Haushaltsbuch.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haushaltsbuch
          path: haushaltsbuch-offline-app/app/build/outputs/apk/release/Haushaltsbuch.apk

